name: 🐞 Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See the error
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Device, OS, Telegram version or browser, app version.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs, anything else
